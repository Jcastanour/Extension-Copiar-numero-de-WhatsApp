<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elixir Cuentas</title>
  <style>
    :root {
      --brand-1: #635bff;
      --brand-2: #8b5cf6;
      --brand-accent: #7c3aed;
      --brand-grad: linear-gradient(135deg, #635bff 0%, #8b5cf6 100%);
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1e1b2e;
      --muted: #6b7280;
      --border: #e7e7ef;
      --ok-bg: #e7f7ee; --ok-fg: #137a45;
      --bad-bg: #fdeaea; --bad-fg: #b42318;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    /* Header */
    .topbar {
      background: var(--brand-grad);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
    }
    .topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
    .topbar .brand .logo { font-size: 18px; }
    .icon-btn {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      width: 32px; height: 32px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.30); }

    .content { padding: 14px; }

    /* Botones */
    .btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 14px;
      transition: transform .05s, box-shadow .2s, background .2s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      width: 100%;
      color: #fff;
      background: var(--brand-grad);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.30);
    }
    .btn-primary:hover { box-shadow: 0 6px 16px rgba(124, 58, 237, 0.40); }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-secondary {
      background: #fff;
      color: var(--brand-accent);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      padding: 9px 10px;
    }
    .btn-secondary:hover { background: #f3f0ff; border-color: #d9d2ff; }

    /* Resultados */
    #resultados { margin-top: 14px; }
    .msg {
      font-size: 13px;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .msg.error { color: var(--bad-fg); border-color: #f3c2bd; background: #fff6f5; }
    .msg.loading::after { content: "…"; }

    .res-head {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin: 0 2px 8px;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(20, 16, 41, 0.05);
    }
    .card-disney {
      border: 1.5px solid transparent;
      background:
        linear-gradient(#fff, #fff) padding-box,
        var(--brand-grad) border-box;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.18);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }
    .disney-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .4px;
      background: var(--brand-grad);
      color: #fff;
      border-radius: 5px;
      padding: 2px 7px;
    }
    .card-email {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      color: #374151;
      background: #f6f6fb;
      border-radius: 7px;
      padding: 6px 8px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: #eef0f4;
      color: #4b5563;
      text-transform: capitalize;
    }
    .badge.active { background: var(--ok-bg); color: var(--ok-fg); }
    .badge.dias-ok { background: var(--ok-bg); color: var(--ok-fg); }
    .badge.dias-vencido { background: var(--bad-bg); color: var(--bad-fg); }

    .copiar {
      width: 100%;
      background: #fff;
      color: var(--brand-accent);
      border: 1px solid #ddd4ff;
      border-radius: 9px;
      font-weight: 600;
      font-size: 13px;
      padding: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    .copiar:hover { background: #f3f0ff; }
    .copiar.copiado { background: var(--ok-bg); color: var(--ok-fg); border-color: #bfe9cf; }

    /* Ajustes */
    .ajustes-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .back-btn {
      background: none; border: none; cursor: pointer;
      color: var(--brand-accent); font-size: 14px; font-weight: 600;
      padding: 4px 6px; border-radius: 8px;
    }
    .back-btn:hover { background: #f3f0ff; }
    .ajustes-head h2 { margin: 0; font-size: 16px; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 9px 11px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }
    .field input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
    #cfgEstado { font-size: 13px; color: var(--ok-fg); margin-left: 10px; font-weight: 600; }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">⚡</span> Elixir Cuentas</div>
    <button id="btnAjustes" class="icon-btn" title="Ajustes">⚙</button>
  </div>

  <!-- Vista principal -->
  <div id="vistaPrincipal" class="content">
    <button id="buscarCuentas" class="btn btn-primary">🔍 Buscar cuentas (Disney)</button>

    <div class="acciones">
      <button id="abrirContacts" class="btn btn-secondary">Abrir contactos</button>
      <button id="copyName" class="btn btn-secondary">Copiar Nombre</button>
      <button id="copyNumber" class="btn btn-secondary">Copiar Número</button>
      <button id="buscarElixir" class="btn btn-secondary">Buscar en Elixir</button>
    </div>

    <div id="resultados">
      <div class="msg">Abre un chat y pulsa <b>Buscar cuentas</b>.</div>
    </div>
  </div>

  <!-- Vista de ajustes -->
  <div id="vistaAjustes" class="content" hidden>
    <div class="ajustes-head">
      <button id="btnVolver" class="back-btn">‹ Volver</button>
      <h2>Ajustes</h2>
    </div>

    <div class="field">
      <label for="cfgBaseUrl">BASE_URL</label>
      <input type="text" id="cfgBaseUrl" placeholder="https://elixircuentas-test.fly.dev" />
      <div class="hint">URL del backend (sin barra final).</div>
    </div>
    <div class="field">
      <label for="cfgApiKey">X-Api-Key</label>
      <input type="password" id="cfgApiKey" placeholder="pega tu API key" />
      <div class="hint">Se guarda solo en este navegador.</div>
    </div>
    <div>
      <button id="cfgGuardar" class="btn btn-primary" style="width:auto; padding:10px 20px;">Guardar</button>
      <span id="cfgEstado"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
